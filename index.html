<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>足球人生 · Football Life</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<!-- ===== 创建角色 ===== -->
<section id="create" class="screen active">
  <div class="logo">
    <h1>足球人生</h1>
    <p>FOOTBALL LIFE</p>
  </div>
  <div class="form-card">
    <div class="field">
      <label>你的名字</label>
      <input id="inp-name" type="text" maxlength="8" placeholder="留空随机生成">
    </div>
    <div class="field">
      <label>场上位置</label>
      <select id="sel-pos">
        <option value="前锋">前锋</option>
        <option value="中场">中场</option>
        <option value="后卫">后卫</option>
        <option value="门将">门将</option>
      </select>
    </div>
    <div class="field">
      <label>足球起点</label>
      <select id="sel-firsttouch"></select>
    </div>
    <button id="btn-start" class="btn primary">开始职业生涯</button>
    <button id="btn-load" class="btn ghost" style="display:none">读取存档</button>
  </div>
</section>

<!-- ===== 主界面 ===== -->
<section id="main" class="screen">
  <header id="topbar">
    <div class="tb-row1">
      <div><span id="v-name">—</span><span id="v-pos">—</span></div>
      <div class="tb-right">
        <div id="v-age">—</div>
        <button id="btn-achv" class="trophy-btn" title="成就">成就<span id="achv-badge">0</span></button>
        <button id="btn-menu" class="icon-btn" title="返回主菜单">菜单</button>
      </div>
    </div>
    <div id="v-club">—</div>
    <div class="tb-row2">
      <span>综合 <b id="v-ca">—</b></span>
      <span>身价 <b id="v-value">—</b></span>
      <span>声望 <b id="v-rep">—</b></span>
    </div>
    <div class="meters">
      <div>体能 <b id="v-fit">—</b><div class="meter" id="bar-fitness"><i></i></div></div>
      <div>状态 <b id="v-form">—</b><div class="meter" id="bar-form"><i></i></div></div>
    </div>
    <div id="v-season">—</div>
  </header>

  <div class="home-body">
    <div class="home-hint" id="home-hint">—</div>
    <div class="tiles">
      <button class="tile t-attr" data-panel="ov-attr">
        <div class="t-head"><span class="t-name">属性</span></div>
        <div class="t-main" id="tile-ca">—</div>
        <div class="t-sub" id="tile-attr-sub">—</div>
        <div class="t-foot">相对联赛评级 ›</div>
      </button>
      <button class="tile t-train" data-panel="ov-train">
        <div class="t-head"><span class="t-name">训练</span></div>
        <div class="t-main small" id="tile-train-main">可训练</div>
        <div class="t-sub" id="tile-train-sub">—</div>
        <div class="t-foot" id="tile-train-foot">—</div>
      </button>
      <div class="tile t-play">
        <div class="t-head"><span class="t-name">下一场</span></div>
        <div class="t-main small" id="tile-role">—</div>
        <div class="t-sub" id="tile-minutes">—</div>
        <div class="t-foot" id="tile-play-foot">—</div>
      </div>
      <div class="t-col">
        <button class="tile t-half t-data" data-panel="ov-data">
          <div class="t-head"><span class="t-name">数据</span><span class="t-more">详情 ›</span></div>
          <div class="t-line" id="m-data">—</div>
        </button>
        <button class="tile t-half t-career" data-panel="ov-career">
          <div class="t-head"><span class="t-name">生涯</span><span class="t-more">详情 ›</span></div>
          <div class="t-line" id="m-career">—</div>
        </button>
      </div>
    </div>
  </div>

  <!-- 底部比赛操作条 -->
  <div id="bottombar">
    <button id="btn-match" class="btn match">出战</button>
    <button id="btn-simweek" class="btn dark">模拟下一场</button>
    <button id="btn-endseason" class="btn" style="background:var(--gold);color:#3a2800">赛季收官</button>
  </div>
</section>

<!-- ===== 属性面板 ===== -->
<div class="overlay" id="ov-attr">
  <div class="panel">
    <div class="panel-head"><span>属性</span><button class="panel-close" data-close="ov-attr">×</button></div>
    <div class="panel-body">
      <div class="attr-summary">
        <div><span>综合</span><b id="data-ca">—</b></div>
        <div><span>潜力</span><b id="data-pot">—</b></div>
        <div><span>体能</span><b id="data-fit">—</b></div>
        <div><span>状态</span><b id="data-form">—</b></div>
      </div>
      <div class="attr-note">★ 综合评级：3★ = 联赛平均（50% 分位），每 10% 分位 ±0.5★ · 属性数值 1–20（FM 色阶）</div>
      <div id="attr-groups"></div>
    </div>
  </div>
</div>

<!-- ===== 训练面板 ===== -->
<div class="overlay" id="ov-train">
  <div class="panel">
    <div class="panel-head"><span>训练安排</span><button class="panel-close" data-close="ov-train">×</button></div>
    <div class="panel-body">
      <h3 id="train-week">—</h3>
      <div class="cat-grid" id="train-cats"></div>
      <div class="int-row" id="day-row"></div>
      <div class="train-preview" id="train-preview">—</div>
      <button id="btn-train" class="btn primary" style="background:var(--green);color:#fff">开始训练</button>
    </div>
  </div>
</div>

<!-- ===== 数据面板 ===== -->
<div class="overlay" id="ov-data">
  <div class="panel">
    <div class="panel-head"><span>数据 · 本赛季</span><button class="panel-close" data-close="ov-data">×</button></div>
    <div class="panel-body">
      <div class="grid2">
        <div class="stat-card"><div class="num" id="v-seasonapps">0</div><div class="lab">出场</div></div>
        <div class="stat-card"><div class="num" id="v-seasongoals">0</div><div class="lab">进球</div></div>
        <div class="stat-card"><div class="num" id="v-seasonassists">0</div><div class="lab">助攻</div></div>
        <div class="stat-card"><div class="num" id="v-seasonrating">—</div><div class="lab">场均评分</div></div>
        <div class="stat-card"><div class="num" id="v-seasonmotm">0</div><div class="lab">全场最佳</div></div>
      </div>
      <h3>最近比赛</h3>
      <div id="season-log"></div>
      <button id="btn-to-career" class="btn ghost" style="width:100%;margin-top:8px">查看生涯 ›</button>
    </div>
  </div>
</div>

<!-- ===== 生涯面板 ===== -->
<div class="overlay" id="ov-career">
  <div class="panel">
    <div class="panel-head"><span>生涯</span><button class="panel-close" data-close="ov-career">×</button></div>
    <div class="panel-body">
      <h3>生涯总览</h3>
      <div id="career-summary"></div>
      <h3>冠军室</h3>
      <div id="trophies-list"></div>
      <h3>赛季履历</h3>
      <div id="career-history"></div>
      <button id="btn-to-data" class="btn ghost" style="width:100%;margin-top:8px">查看数据 ›</button>
    </div>
  </div>
</div>

<!-- ===== 成就面板 ===== -->
<div class="overlay" id="ov-achv">
  <div class="panel">
    <div class="panel-head"><span>成就殿堂</span><button class="panel-close" data-close="ov-achv">×</button></div>
    <div class="panel-body">
      <div id="achv-head">
        <span class="muted">解锁进度</span>
        <span id="achv-count">0 / 0</span>
      </div>
      <div id="achv-grid"></div>
    </div>
  </div>
</div>

<!-- ===== 比赛实况层 ===== -->
<div class="overlay" id="match-layer">
  <div class="panel match-panel">
    <div class="panel-head" id="match-title">比赛</div>
    <div id="match-hud">
      <div class="mh-block"><b id="mh-minute">0'</b><span>时间</span></div>
      <div class="mh-block mh-center"><b id="mh-score">0 : 0</b><span id="mh-teams">—</span></div>
      <div class="mh-block"><b id="mh-rating">6.5</b><span>评分</span></div>
    </div>
    <div class="panel-body" id="match-lines"></div>
    <div class="panel-foot">
      <button id="btn-match-close" class="btn primary" style="background:var(--green);color:#fff">继续</button>
      <button id="btn-again" class="btn" onclick="location.reload()">再踢一辈子</button>
    </div>
  </div>
</div>

<!-- ===== 转会层 ===== -->
<div class="overlay" id="offer-layer">
  <div class="panel">
    <div class="panel-head">报价与邀请</div>
    <div class="panel-body" id="offers-box"></div>
  </div>
</div>

<!-- ===== 存档槽 ===== -->
<div class="overlay" id="slot-layer">
  <div class="panel">
    <div class="panel-head"><span id="slot-title">存档</span><button class="panel-close" data-close="slot-layer">×</button></div>
    <div class="panel-body">
      <div id="slot-list"></div>
      <button id="slot-discard" class="btn" style="display:none;width:100%;background:#e5e7eb;color:#374151;margin-top:4px">放弃本次存档</button>
    </div>
  </div>
</div>

<div id="toast"></div>


<!-- 依赖顺序：配置数据 → 仿真引擎 → 界面交互 -->
<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
